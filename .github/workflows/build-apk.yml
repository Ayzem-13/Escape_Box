name: Build Android APK

on:
  push:
    branches: [main, feat/mobile]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web (mobile target)
        run: npm run build:mobile

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EscapeBox.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: escape-box-apk
          path: EscapeBox.apk
          if-no-files-found: error

      - name: Update "latest" release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Android APK
          body: |
            APK généré automatiquement depuis le dernier commit.
            Télécharge **EscapeBox.apk** ci-dessous, ouvre-le sur Android, et installe.
          files: EscapeBox.apk
          prerelease: true
